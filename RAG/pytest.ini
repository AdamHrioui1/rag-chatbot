[pytest]
# Without this, `from app...` imports only resolve when pytest happens to
# be invoked in a way that adds the current directory to sys.path (e.g.
# `python -m pytest`) - the bare `pytest` command does not do this, which
# caused a real CI failure (ModuleNotFoundError: No module named 'app')
# even though the exact same tests passed locally. This makes the import
# work correctly regardless of how pytest is invoked.
pythonpath = .
