name: CI

# Runs on every push to main, and on every pull request targeting main.
# The pull_request trigger is the one that matters day-to-day: it gives
# you a pass/fail check on a PR *before* you merge, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- RAG service: the real test suite (44 pytest tests) ---
  rag-tests:
    name: RAG service tests
    runs-on: ubuntu-latest
    env:
      # These are placeholder values, NOT real secrets - safe to keep
      # directly in this file. The test suite never makes a real network
      # or database call (services are mocked); it just needs the app to
      # import and construct its client objects (OpenAI client,
      # MongoClient, Chroma client) without crashing on a missing value.
      DEEPSEEK_API_KEY: test-key
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      DEEPSEEK_MODEL: deepseek-chat
      ACCESS_TOKEN_SECRET: test-secret-used-only-in-ci-not-a-real-credential
      JWT_ALGORITHM: HS256
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: test
      CHROMA_PATH: ./chroma_ci

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: RAG/requirements.txt

      - name: Install CPU-only PyTorch
        # Same reasoning as RAG/Dockerfile: a plain `pip install` on Linux
        # pulls the multi-GB CUDA build by default. GitHub's runners have
        # no GPU, so we install the small CPU-only build first.
        working-directory: RAG
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: RAG
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        working-directory: RAG
        run: pytest -q

  # --- Node server: verify it installs cleanly ---
  # There's no automated test suite for the Node server yet, so this job
  # is honestly scoped to what it actually checks: dependencies install
  # without errors (this alone catches a surprising number of real
  # problems - a broken package-lock.json, a native module that fails to
  # build, a typo'd dependency version).
  server-install:
    name: Node server install check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

  # --- React client: verify it actually builds for production ---
  # `npm run build` runs under CI=true here, which promotes ESLint
  # warnings to build-breaking errors - a stricter, more useful check
  # than the dev server gives you.
  client-build:
    name: React client build
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
