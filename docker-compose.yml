services:
  rag:
    build: ./RAG
    ports:
      - "8000:8000"
    env_file:
      - ./RAG/.env
    volumes:
      # Bind mount: maps a folder on YOUR disk into the container, at the
      # same path the app reads/writes (CHROMA_PATH=chroma in RAG/.env).
      # Without this, anything written inside the container disappears
      # the moment the container is removed - a container's own
      # filesystem is thrown away with it. A bind mount (rather than a
      # Docker-managed "named volume") was chosen because it's just an
      # ordinary folder on your machine you can open and inspect
      # directly. Uploaded document *files* no longer need a mount here -
      # they live in S3 now, which is already durable on its own.
      - ./RAG/chroma:/app/chroma

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      # Overrides RAG_API_URL from server/.env: inside this Docker
      # network, the RAG service is reachable at the hostname "rag"
      # (its service name above), not "localhost".
      - RAG_API_URL=http://rag:8000/chat
    depends_on:
      - rag
